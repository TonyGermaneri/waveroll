[package]
name = "waveroll-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The browser binding: one object the page drives, everything else in Rust."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
waveroll-core = { path = "../waveroll-core" }
waveroll-gpu = { path = "../waveroll-gpu" }
# Pinned to the installed wasm-bindgen CLI. A mismatch between the crate and the tool is the
# single most common way a wasm build fails, and it fails at generation time with a message about
# schema versions rather than anywhere useful.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "Window", "Document", "Element", "Performance"]
