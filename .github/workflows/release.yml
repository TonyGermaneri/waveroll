# Cutting a release.
#
#   git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# Builds every target from the tagged commit, validates the Audio Unit against the artefact that
# will actually be published, and attaches one zip per target. Nothing here is signed with a
# Developer ID -- see the note the release notes carry about quarantine.
name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install ninja

      # The certificate goes into a keychain of its own, created for this job and deleted after it,
      # so nothing is left behind on a runner and nothing touches the login keychain.
      #
      # set-key-partition-list is the line that matters and the one that is easy to leave out:
      # without it codesign is not on the key's access list, and it waits for a UI prompt that a
      # runner has no way to answer. The job does not fail, it hangs until the timeout.
      - name: Import the signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # Skipped in shell rather than in an `if:`, because the secrets context is not available
          # to a step's if -- the usual dance is to launder it through env first, and this needs no
          # dance. A fork with no certificate falls through to an honest ad-hoc build.
          if [ -z "$P12" ]; then
            echo "no certificate configured; this build will be ad-hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/waveroll.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null || true
          # A PKCS#12 begins with an ASN.1 SEQUENCE, 0x30. Checked because the secret has to be
          # base64 of a binary file, and pasting the file itself is the obvious thing to try --
          # which fails much later, in security import, with a message about neither.
          if [ "$(head -c1 "$RUNNER_TEMP/cert.p12" | od -An -tx1 | tr -d ' ')" != "30" ]; then
            echo "MACOS_CERTIFICATE_P12 did not base64-decode to a .p12" >&2
            echo "set it with: base64 -i cert.p12 | gh secret set MACOS_CERTIFICATE_P12" >&2
            exit 1
          fi
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application'

      - name: Build and package
        env:
          # required when there is a certificate, so a broken credential stops the release instead
          # of quietly producing an ad-hoc build the notes would then describe wrongly. off when
          # there is not, so a fork can still cut a release -- an honest unsigned one.
          WAVEROLL_NOTARIZE: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && 'required' || 'off' }}
          # Empty on a fork, which package-macos.sh reads as "find the one identity in the
          # keychain" -- the same thing it does on a laptop.
          WAVEROLL_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -n "$NOTARY_KEY_P8" ]; then
            export NOTARY_KEY_PATH="$RUNNER_TEMP/api.p8"
            # A .p8 is PEM text, so pasting the file's contents straight into the secret is the
            # natural thing to do and works fine -- but so is base64-ing it, as the binary .p12
            # next to it requires. Both are accepted rather than one being declared correct.
            if printf '%s' "$NOTARY_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s\n' "$NOTARY_KEY_P8" > "$NOTARY_KEY_PATH"
            else
              printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH" 2>/dev/null || true
            fi
            chmod 600 "$NOTARY_KEY_PATH"
            grep -q 'BEGIN PRIVATE KEY' "$NOTARY_KEY_PATH" || {
              echo "NOTARY_KEY_P8 is neither an App Store Connect key nor base64 of one" >&2
              exit 1; }
          fi
          tools/package-macos.sh ${{ github.ref_name }}
          rm -f "$RUNNER_TEMP/api.p8"

      # always(), because a keychain left on a runner after a failed build is the one thing here
      # worth being fussy about.
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/waveroll.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/api.p8" "$RUNNER_TEMP/cert.p12"

      # The binary that gets published is the binary that gets validated. Building a second time
      # to test would be testing a different build.
      - name: Validate the Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto -x -k dist/macos/Waveroll-${{ github.ref_name }}-macOS-AU.zip \
            ~/Library/Audio/Plug-Ins/Components
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumf Wvr1 WvCt

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          # Not just the zips: signing.txt rides along so the notes can describe the build that was
          # made. It is not a zip, so the publish job does not attach it to the release.
          path: dist/macos/*

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build the site
        run: tools/package-web.sh ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.zip

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [macos, web]
    permissions:
      contents: write
    steps:
      # The tags are needed to work out what the previous release was, which is what the changelog
      # in the notes is computed against.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Collect the artefacts
        run: |
          mkdir -p dist
          find incoming -name '*.zip' -exec mv {} dist/ \;
          # The ./ is stripped but the two spaces are not: sha256sum -c wants exactly the
          # format sha256sum wrote, and collapsing the separator makes the file unverifiable.
          cd dist && sha256sum ./*.zip | sed 's|\./||' | tee SHA256SUMS.txt

      - name: Write the notes
        run: |
          WAVEROLL_SIGNING="$(cat incoming/macos/signing.txt 2>/dev/null || echo ad-hoc)" \
            tools/release-notes.sh "${{ github.ref_name }}" > dist/NOTES.md
          head -20 dist/NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Waveroll ${{ github.ref_name }}" \
            --notes-file dist/NOTES.md \
            dist/*.zip dist/SHA256SUMS.txt
