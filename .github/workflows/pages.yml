# Publishes the browser build to GitHub Pages on every push to main.
#
# The web build is a real target of this project rather than a demo, but it is the lesser one: a
# browser can only offer a file *promise* on a drag, and no DAW accepts one, so the page writes
# into a watched folder instead of dragging. Worth having hosted; not worth mistaking for the
# plug-in.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let an in-flight one finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Build the site
        run: tools/package-web.sh ${{ github.sha }}

      # Pages has to be switched on by hand, once. The obvious-looking shortcut -- passing
      # enablement: true to configure-pages -- cannot work: creating a Pages site is an
      # administration-scoped API, and no GITHUB_TOKEN can hold that scope however the workflow
      # asks for it. So this checks instead of assuming, and reports rather than failing: a build
      # that goes red every push until somebody visits a settings page teaches people to ignore
      # red builds.
      - name: Is Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages is not switched on::The site built. To publish it, go to           Settings -> Pages -> Build and deployment and set Source to GitHub Actions. This job           will deploy on the next push. Until then it builds only."
          fi

      - if: steps.pages.outputs.ready == 'true'
        uses: actions/configure-pages@v6
      - if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - if: steps.pages.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
